<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <div class="morph" id="morph">

        <div class="btn-text">Login</div>

        <div class="close" onclick="closeForm(event)">✕</div>

        <div class="form">

            <h2 style="text-align:center;margin-bottom:5px;">Welcome</h2>
            <div style="text-align:center;margin-bottom:15px;font-size:11px;color:#aaa;opacity:0.85;">
                Tài khoản: <strong style="color: #06b6d4;">admin</strong> | Mật khẩu: <strong
                    style="color: #06b6d4;">123</strong>
            </div>

            <div class="input-box">
                <input type="text" id="username" required autocomplete="off">
                <label>Username</label>
            </div>

            <div class="input-box">
                <input type="password" id="password" required>
                <label>Password</label>
            </div>

            <button class="submit" id="loginBtn">Login</button>

        </div>

    </div>

    <script src="login.js"></script>
</body>

</html>
