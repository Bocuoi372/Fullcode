  <script>
  /*
 * Settings
 */
var settings = {
  particles: {
    length:   2000, // maximum amount of particles
    duration:   2, // particle duration in sec
    velocity: 100, // particle velocity in pixels/sec
    effect: -1.3, // play with this for a nice effect
    size:      13, // particle size in pixels
  },
};
/*
 * RequestAnimationFrame polyfill by Erik Möller
 */
(function(){var b=0;var c=["ms","moz","webkit","o"];for(var a=0;a<c.length&&!window.requestAnimationFrame;++a){window.requestAnimationFrame=window[c[a]+"RequestAnimationFrame"];window.cancelAnimationFrame=window[c[a]+"CancelAnimationFrame"]||window[c[a]+"CancelRequestAnimationFrame"]}if(!window.requestAnimationFrame){window.requestAnimationFrame=function(h,e){var d=new Date().getTime();var f=Math.max(0,16-(d-b));var g=window.setTimeout(function(){h(d+f)},f);b=d+f;return g}}if(!window.cancelAnimationFrame){window.cancelAnimationFrame=function(d){clearTimeout(d)}}}());
/*
 * Point class
 */
var Point = (function() {
  function Point(x, y) {
    this.x = (typeof x !== 'undefined') ? x : 0;
    this.y = (typeof y !== 'undefined') ? y : 0;
  }
  Point.prototype.clone = function() {
    return new Point(this.x, this.y);
  };
  Point.prototype.length = function(length) {
    if (typeof length == 'undefined')
      return Math.sqrt(this.x * this.x + this.y * this.y);
    this.normalize();
    this.x *= length;
    this.y *= length;
    return this;
  };
  Point.prototype.normalize = function() {
    var length = this.length();
    this.x /= length;
    this.y /= length;
    return this;
  };
  return Point;
})();
/*
 * Particle class
 */
var Particle = (function() {
  function Particle() {
    this.position = new Point();
    this.velocity = new Point();
    this.acceleration = new Point();
    this.age = 0;
  }
  Particle.prototype.initialize = function(x, y, dx, dy) {
    this.position.x = x;
    this.position.y = y;
    this.velocity.x = dx;
    this.velocity.y = dy;
    this.acceleration.x = dx * settings.particles.effect;
    this.acceleration.y = dy * settings.particles.effect;
    this.age = 0;
  };
  Particle.prototype.update = function(deltaTime) {
    this.position.x += this.velocity.x * deltaTime;
    this.position.y += this.velocity.y * deltaTime;
    this.velocity.x += this.acceleration.x * deltaTime;
    this.velocity.y += this.acceleration.y * deltaTime;
    this.age += deltaTime;
  };
  Particle.prototype.draw = function(context, image) {
    function ease(t) {
      return (--t) * t * t + 1;
    }
    var size = image.width * ease(this.age / settings.particles.duration);
    context.globalAlpha = 1 - this.age / settings.particles.duration;
    context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
  };
  return Particle;
})();
/*
 * ParticlePool class
 */
var ParticlePool = (function() {
  var particles,
      firstActive = 0,
      firstFree   = 0,
      duration    = settings.particles.duration;
 
  function ParticlePool(length) {
    // create and populate particle pool
    particles = new Array(length);
    for (var i = 0; i < particles.length; i++)
      particles[i] = new Particle();
  }
  ParticlePool.prototype.add = function(x, y, dx, dy) {
    particles[firstFree].initialize(x, y, dx, dy);
   
    // handle circular queue
    firstFree++;
    if (firstFree   == particles.length) firstFree   = 0;
    if (firstActive == firstFree       ) firstActive++;
    if (firstActive == particles.length) firstActive = 0;
  };
  ParticlePool.prototype.update = function(deltaTime) {
    var i;
   
    // update active particles
    if (firstActive < firstFree) {
      for (i = firstActive; i < firstFree; i++)
        particles[i].update(deltaTime);
    }
    if (firstFree < firstActive) {
      for (i = firstActive; i < particles.length; i++)
        particles[i].update(deltaTime);
      for (i = 0; i < firstFree; i++)
        particles[i].update(deltaTime);
    }
   
    // remove inactive particles
    while (particles[firstActive].age >= duration && firstActive != firstFree) {
      firstActive++;
      if (firstActive == particles.length) firstActive = 0;
    }
   
   
  };
  ParticlePool.prototype.draw = function(context, image) {
    // draw active particles
    if (firstActive < firstFree) {
      for (i = firstActive; i < firstFree; i++)
        particles[i].draw(context, image);
    }
    if (firstFree < firstActive) {
      for (i = firstActive; i < particles.length; i++)
        particles[i].draw(context, image);
      for (i = 0; i < firstFree; i++)
        particles[i].draw(context, image);
    }
  };
  return ParticlePool;
})();
/*
 * Putting it all together
 */
(function(canvas) {
  var context = canvas.getContext('2d'),
      particles = new ParticlePool(settings.particles.length),
      particleRate = settings.particles.length / settings.particles.duration, // particles/sec
      time;
 
  // get point on heart with -PI <= t <= PI
  function pointOnHeart(t) {
    var radius = 210;
    return new Point(
      radius * Math.cos(t),
      radius * Math.sin(t)
    );
  }
 
  // creating the particle image using a dummy canvas
  var image = (function() {
    var canvas  = document.createElement('canvas'),
        context = canvas.getContext('2d');
    canvas.width  = settings.particles.size;
    canvas.height = settings.particles.size;
    // helper function to create the path
    function to(t) {
      var point = pointOnHeart(t);
      point.x = settings.particles.size / 2 + point.x * settings.particles.size / 350;
      point.y = settings.particles.size / 2 - point.y * settings.particles.size / 350;
      return point;
    }
    // create the path
    context.beginPath();
    var t = -Math.PI;
    var point = to(t);
    context.moveTo(point.x, point.y);
    while (t < Math.PI) {
      t += 0.01; // baby steps!
      point = to(t);
      context.lineTo(point.x, point.y);
    }
    context.closePath();
    // create the fill
    context.fillStyle = '#FF5CA4';
    context.fill();
    // create the image
    var image = new Image();
    image.src = canvas.toDataURL();
    return image;
  })();
 
  // render that thing!
  function render() {
    // next animation frame
    requestAnimationFrame(render);
   
    // update time
    var newTime   = new Date().getTime() / 1000,
        deltaTime = newTime - (time || newTime);
    time = newTime;
   
    // clear canvas
    context.clearRect(0, 0, canvas.width, canvas.height);
   
    // create new particles
    var amount = particleRate * deltaTime;
    for (var i = 0; i < amount; i++) {
      var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
      var dir = pos.clone().length(settings.particles.velocity);
      particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
    }
   
    // update and draw particles
    particles.update(deltaTime);
    particles.draw(context, image);
  }
 
  // handle (re-)sizing of the canvas
  function onResize() {
    canvas.width  = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.onresize = onResize;
 
  // delay rendering bootstrap
  setTimeout(function() {
    onResize();
    render();
  }, 10);
})(document.getElementById('pinkboard'));

// ==================== TROLL SYSTEM ====================
function playBoingSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(380, ctx.currentTime + 0.12);
        osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.28);
        
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.28);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.28);
    } catch(e) {
        console.log("Audio not allowed yet");
    }
}

function playSuccessChime() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
        osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3); // C6
        
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
    } catch(e) {
        console.log("Audio error");
    }
}

// 1. Runaway escaping back button
const backBtn = document.querySelector('.back-button');
let escapeCount = 0;

if (backBtn) {
    // Intercept clicks
    backBtn.addEventListener('click', (e) => {
        if (escapeCount < 6) {
            e.preventDefault();
            escapeBtn();
        } else {
            // Trigger confirmation modal instead of going back immediately!
            e.preventDefault();
            document.getElementById('trollModal').classList.add('active');
        }
    });

    backBtn.addEventListener('mouseover', (e) => {
        if (escapeCount < 6) {
            escapeBtn();
        }
    });
}

function escapeBtn() {
    playBoingSound();
    
    const btnWidth = backBtn.offsetWidth;
    const btnHeight = backBtn.offsetHeight;
    
    const maxX = window.innerWidth - btnWidth - 40;
    const maxY = window.innerHeight - btnHeight - 40;
    
    const randomX = Math.max(20, Math.floor(Math.random() * maxX));
    const randomY = Math.max(20, Math.floor(Math.random() * maxY));
    
    backBtn.style.position = 'fixed';
    backBtn.style.left = randomX + 'px';
    backBtn.style.top = randomY + 'px';
    backBtn.style.bottom = 'auto';
    backBtn.style.transform = 'none';
    backBtn.style.zIndex = '99999';
    
    escapeCount++;
    
    if (escapeCount === 1) backBtn.innerText = "Hụt rồi! 😜";
    if (escapeCount === 2) backBtn.innerText = "Lại trượt! 😂";
    if (escapeCount === 3) backBtn.innerText = "Còn lâu mới bấm được!";
    if (escapeCount === 4) backBtn.innerText = "Đừng cố hihi! 🤫";
    if (escapeCount === 5) backBtn.innerText = "Bắt tôi đi!";
    if (escapeCount === 6) {
        backBtn.innerText = "Thôi tha đó, bấm đi! 🥺";
        backBtn.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)"; // Green color
    }
}

// 2. Modal logic: Swap buttons on hover
const btnNo = document.getElementById('btnNo');
const btnYes = document.getElementById('btnYes');
const modalButtons = document.getElementById('modalButtons');

if (btnNo && modalButtons) {
    btnNo.addEventListener('mouseover', () => {
        // Swap positions of Yes and No buttons
        if (modalButtons.style.flexDirection === 'row-reverse') {
            modalButtons.style.flexDirection = 'row';
        } else {
            modalButtons.style.flexDirection = 'row-reverse';
        }
        playBoingSound();
    });
    
    btnNo.addEventListener('click', (e) => {
        e.preventDefault();
        alert("Không được nói dối! Hệ thống phát hiện bạn đang nói dối! 🤖");
        // Force the Yes outcome
        triggerYesOutcome();
    });
}

if (btnYes) {
    btnYes.addEventListener('click', () => {
        triggerYesOutcome();
    });
}

function triggerYesOutcome() {
    playSuccessChime();
    document.getElementById('trollModal').classList.remove('active');
    
    // Create heavy heart confetti explosion
    createHeartConfetti();
    
    // Nice alert
    setTimeout(() => {
        alert("Ngoan lắm! Phải thừa nhận thế chứ. Nhưng cảnh báo: Hệ thống của bạn đang bị kiểm soát! 😈");
        window.location.href = "index2.html";
    }, 2000);
}

function createHeartConfetti() {
    const colors = ['#ff5ca4', '#ff8a5c', '#ff3b3b', '#ff9d5c'];
    for (let i = 0; i < 100; i++) {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.style.position = 'fixed';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.top = '-50px';
        heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
        heart.style.zIndex = '999999';
        heart.style.pointerEvents = 'none';
        heart.style.transform = `rotate(${Math.random() * 360}deg)`;
        
        // Physics variables
        const speed = Math.random() * 5 + 3;
        const drift = Math.random() * 4 - 2;
        let rotation = Math.random() * 360;
        const rotSpeed = Math.random() * 4 - 2;
        
        document.body.appendChild(heart);
        
        let topPos = -50;
        let leftPos = parseFloat(heart.style.left);
        
        const interval = setInterval(() => {
            topPos += speed;
            leftPos += drift;
            rotation += rotSpeed;
            
            heart.style.top = topPos + 'px';
            heart.style.left = leftPos + 'px';
            heart.style.transform = `rotate(${rotation}deg)`;
            
            if (topPos > window.innerHeight) {
                clearInterval(interval);
                heart.remove();
            }
        }, 16);
    }
}
